<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাই পোর্টফোলিও</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="profile-img">
            <img src="https://via.placeholder.com/150" alt="Profile Picture" id="avatar">
        </div>
        <h1 id="name">আপনার নাম</h1>
        <p class="title" id="role">ওয়েব ডেভেলপার</p>
        <p class="description">
            স্বাগতম আমার পার্সোনাল প্রোফাইলে! আমি কোডিং করতে এবং সুন্দর সুন্দর ওয়েব প্রজেক্ট তৈরি করতে ভালোবাসি।
        </p>
        
        <div class="social-links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://facebook.com" target="_blank">Facebook</a>
        </div>

        <button id="theme-btn">থিম পরিবর্তন করুন</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
